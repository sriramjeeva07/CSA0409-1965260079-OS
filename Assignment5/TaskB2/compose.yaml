services:
  portal:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://portal:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/results
    depends_on: [db]
    mem_limit: 512m
    cpus: 0.50
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: results
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
volumes:
  pgdata: